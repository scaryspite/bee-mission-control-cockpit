<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Beeps Desktop Pet</title>
    <style>
      :root {
        --cyan: #38bdf8;
        --pink: #f472b6;
        --purple: #c084fc;
        --bg-glass: rgba(15, 23, 42, 0.92);
        --border-glass: rgba(56, 189, 248, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: transparent !important;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Desktop Pet Stage Container */
      .pet-stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 6px;
      }

      /* Ground Contact Shadow & Neon Cyber Glow */
      .pet-presence {
        position: absolute;
        bottom: 3px;
        width: 104px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.7) 0%, rgba(56, 189, 248, 0.4) 35%, rgba(244, 114, 182, 0.12) 60%, transparent 75%);
        filter: blur(2.5px);
        pointer-events: none;
        animation: presence-pulse 3.2s ease-in-out infinite alternate;
        transition: transform 0.25s ease, opacity 0.25s ease;
      }

      /* Character-Specific Floor Glows & Bubble Themes */
      .pet-stage[data-character="nebula"] .pet-presence {
        background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.7) 0%, rgba(192, 132, 252, 0.5) 35%, rgba(244, 114, 182, 0.2) 60%, transparent 75%);
        width: 104px;
      }
      .pet-stage[data-character="alloy"] .pet-presence {
        background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.7) 0%, rgba(245, 158, 11, 0.55) 35%, rgba(251, 191, 36, 0.2) 60%, transparent 75%);
        width: 90px;
      }
      .pet-stage[data-character="doublestuffiana"] .pet-presence {
        background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.7) 0%, rgba(34, 197, 94, 0.5) 35%, rgba(16, 185, 129, 0.2) 60%, transparent 75%);
        width: 140px;
        height: 22px;
      }

      .pet-stage[data-character="nebula"] .pet-bubble {
        border-color: rgba(192, 132, 252, 0.4);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 14px rgba(192, 132, 252, 0.3);
      }
      .pet-stage[data-character="alloy"] .pet-bubble {
        border-color: rgba(245, 158, 11, 0.4);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 14px rgba(245, 158, 11, 0.3);
      }
      .pet-stage[data-character="doublestuffiana"] .pet-bubble {
        border-color: rgba(34, 197, 94, 0.4);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 14px rgba(34, 197, 94, 0.3);
      }

      @keyframes presence-pulse {
        from { transform: scale(0.88); opacity: 0.65; }
        to { transform: scale(1.08); opacity: 0.95; }
      }

      /* Compact Speech Bubble positioned right above actor */
      .pet-bubble {
        position: absolute;
        bottom: 222px;
        left: 10px;
        right: 10px;
        max-width: 220px;
        margin: 0 auto;
        background: var(--bg-glass);
        border: 1px solid var(--border-glass);
        border-radius: 10px;
        padding: 7px 11px;
        color: #f1f5f9;
        font-size: 11.5px;
        line-height: 1.35;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 12px rgba(56, 189, 248, 0.25);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        opacity: 0;
        transform: translateY(-4px) scale(0.96);
        transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
        z-index: 20;
        max-height: 86px;
        overflow: hidden;
      }

      .pet-bubble.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      .pet-bubble::after {
        content: "";
        position: absolute;
        bottom: -5px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 5px 5px 0 5px;
        border-style: solid;
        border-color: var(--bg-glass) transparent transparent transparent;
      }

      .pet-bubble-speaker {
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--cyan);
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .pet-bubble-text {
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Compact Full Body Actor Box (2:3 Aspect Ratio matching 1024x1536) */
      .pet-actor-box {
        position: relative;
        width: 210px;
        height: 315px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        cursor: grab;
        z-index: 2;
        transition: transform 0.25s ease;
      }

      .pet-actor-box:hover .pet-frame {
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
      }

      .pet-actor-box:active {
        cursor: grabbing;
      }

      /* Base Frame Layers */
      .pet-frame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.65));
        opacity: 0;
        pointer-events: none;
        user-select: none;
        transition: opacity 0.12s ease;
      }

      /* Idle Animation: 2-Frame Cycle with Gentle Breathing */
      .pet-actor-box[data-mode="idle"] .frame-idle-a {
        opacity: 1;
        animation: pet-idle-frame-a 2.8s steps(1, end) infinite, pet-breathe 3.4s ease-in-out infinite alternate;
      }
      .pet-actor-box[data-mode="idle"] .frame-idle-b {
        opacity: 0;
        animation: pet-idle-frame-b 2.8s steps(1, end) infinite, pet-breathe 3.4s ease-in-out infinite alternate;
      }

      /* Complete / Cheer Animation: 2-Frame Cycle */
      .pet-actor-box[data-mode="complete"] .frame-complete-a,
      .pet-actor-box[data-mode="cheer"] .frame-cheer-a {
        opacity: 1;
        animation: pet-idle-frame-a 1.2s steps(1, end) infinite;
      }
      .pet-actor-box[data-mode="complete"] .frame-complete-b,
      .pet-actor-box[data-mode="cheer"] .frame-cheer-b {
        opacity: 0;
        animation: pet-idle-frame-b 1.2s steps(1, end) infinite;
      }

      /* Error / Shock Animation: 2-Frame Cycle */
      .pet-actor-box[data-mode="error"] .frame-error-a {
        opacity: 1;
        animation: pet-idle-frame-a 0.8s steps(1, end) infinite;
      }
      .pet-actor-box[data-mode="error"] .frame-error-b {
        opacity: 0;
        animation: pet-idle-frame-b 0.8s steps(1, end) infinite;
      }

      @keyframes pet-idle-frame-a {
        0%, 82%, 100% { opacity: 1; }
        83%, 99% { opacity: 0; }
      }
      @keyframes pet-idle-frame-b {
        0%, 82%, 100% { opacity: 0; }
        83%, 99% { opacity: 1; }
      }

      @keyframes pet-breathe {
        0% { transform: translateY(0) scaleY(1); }
        50% { transform: translateY(-2px) scaleY(1.01) scaleX(0.995); }
        100% { transform: translateY(0) scaleY(1); }
      }

      /* Character Identity Auras & Indicators */
      .pet-actor-box[data-character="nebula"] {
        filter: drop-shadow(0 0 14px rgba(192, 132, 252, 0.5));
      }
      .pet-actor-box[data-character="alloy"] {
        filter: drop-shadow(0 0 14px rgba(245, 158, 11, 0.5));
      }
      .pet-actor-box[data-character="doublestuffiana"] {
        filter: drop-shadow(0 0 16px rgba(34, 197, 94, 0.5));
      }
      .pet-actor-box[data-character="beeps"] {
        filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.45));
      }

      /* Staging Entrance Keyframes */
      @keyframes pet-thud-drop {
        0% { transform: translateY(-35px) scale(0.92); opacity: 0.6; }
        65% { transform: translateY(4px) scale(1.08, 0.92); }
        85% { transform: translateY(-2px) scale(0.98, 1.02); }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }

      @keyframes pet-gremlin-pop {
        0% { transform: translateY(30px) scale(0.85); opacity: 0.5; }
        70% { transform: translateY(-8px) scale(1.05, 0.95); }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }

      @keyframes pet-regal-slide {
        0% { transform: translateY(-16px); opacity: 0.4; }
        100% { transform: translateY(0); opacity: 1; }
      }

      /* Walk Animation: Left / Right Stepping with Bob, Hip Sway & Distinct Swagger */
            /* Walk Animation: Left / Right Stepping with Bob, Hip Sway & Distinct Swagger */
      .pet-actor-box[data-mode^="walk"] .pet-frame {
        transition: none !important;
      }

      .pet-actor-box[data-mode="walk-left"] {
        transform-origin: 50% 95%;
        animation: pet-walk-bob-left 0.68s ease-in-out infinite;
      }
      .pet-actor-box[data-mode="walk-right"] {
        transform-origin: 50% 95%;
        animation: pet-walk-bob-right 0.68s ease-in-out infinite;
      }

      /* Clean rhythmic stride bob & tilt on the whole character box */
      @keyframes pet-walk-bob-left {
        0%, 100% {
          transform: translateY(0) rotate(-2.5deg);
        }
        25% {
          transform: translateY(-5px) rotate(-1deg);
        }
        50% {
          transform: translateY(0) rotate(2.5deg);
        }
        75% {
          transform: translateY(-5px) rotate(1deg);
        }
      }

      @keyframes pet-walk-bob-right {
        0%, 100% {
          transform: translateY(0) rotate(2.5deg);
        }
        25% {
          transform: translateY(-5px) rotate(1deg);
        }
        50% {
          transform: translateY(0) rotate(-2.5deg);
        }
        75% {
          transform: translateY(-5px) rotate(-1deg);
        }
      }

      /* Crisp 4-frame stride & passing cycle (a -> c -> b -> d) */
      .pet-actor-box[data-mode="walk-left"] .frame-walk-l-a,
      .pet-actor-box[data-mode="walk-right"] .frame-walk-r-a {
        animation: pet-step-4-a 0.68s step-end infinite;
      }
      .pet-actor-box[data-mode="walk-left"] .frame-walk-l-c,
      .pet-actor-box[data-mode="walk-right"] .frame-walk-r-c {
        animation: pet-step-4-c 0.68s step-end infinite;
      }
      .pet-actor-box[data-mode="walk-left"] .frame-walk-l-b,
      .pet-actor-box[data-mode="walk-right"] .frame-walk-r-b {
        animation: pet-step-4-b 0.68s step-end infinite;
      }
      .pet-actor-box[data-mode="walk-left"] .frame-walk-l-d,
      .pet-actor-box[data-mode="walk-right"] .frame-walk-r-d {
        animation: pet-step-4-d 0.68s step-end infinite;
      }

      @keyframes pet-step-4-a {
        0%, 24.99% { opacity: 1; }
        25%, 100% { opacity: 0; }
      }
      @keyframes pet-step-4-c {
        0%, 24.99% { opacity: 0; }
        25%, 49.99% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pet-step-4-b {
        0%, 49.99% { opacity: 0; }
        50%, 74.99% { opacity: 1; }
        75%, 100% { opacity: 0; }
      }
      @keyframes pet-step-4-d {
        0%, 74.99% { opacity: 0; }
        75%, 100% { opacity: 1; }
      }

      /* Pose Modes: Coffee Sipping (4-Frame Cycle across deck chair & standing mugs) */
      .pet-actor-box[data-mode="coffee"] .frame-coffee-a,
      .pet-actor-box[data-routine="morning_coffee"][data-mode="idle"] .frame-coffee-a {
        opacity: 1 !important;
        animation: pet-step-4-a 3.2s step-end infinite, pet-coffee-sip 3.2s ease-in-out infinite alternate !important;
      }
      .pet-actor-box[data-mode="coffee"] .frame-coffee-b,
      .pet-actor-box[data-routine="morning_coffee"][data-mode="idle"] .frame-coffee-b {
        opacity: 0 !important;
        animation: pet-step-4-c 3.2s step-end infinite, pet-coffee-sip 3.2s ease-in-out infinite alternate !important;
      }
      .pet-actor-box[data-mode="coffee"] .frame-coffee-c,
      .pet-actor-box[data-routine="morning_coffee"][data-mode="idle"] .frame-coffee-c {
        opacity: 0 !important;
        animation: pet-step-4-b 3.2s step-end infinite, pet-coffee-sip 3.2s ease-in-out infinite alternate !important;
      }
      .pet-actor-box[data-mode="coffee"] .frame-coffee-d,
      .pet-actor-box[data-routine="morning_coffee"][data-mode="idle"] .frame-coffee-d {
        opacity: 0 !important;
        animation: pet-step-4-d 3.2s step-end infinite, pet-coffee-sip 3.2s ease-in-out infinite alternate !important;
      }

      .pet-actor-box[data-routine="morning_coffee"][data-mode="idle"] .frame-idle-a,
      .pet-actor-box[data-routine="morning_coffee"][data-mode="idle"] .frame-idle-b {
        opacity: 0 !important;
        animation: none !important;
      }

      .pet-actor-box[data-mode="coffee"] {
        animation: pet-coffee-sip 2.6s ease-in-out infinite alternate;
      }
      @keyframes pet-coffee-sip {
        0% { transform: translateY(0); }
        50% { transform: translateY(-2px) scaleY(1.01); }
        100% { transform: translateY(0); }
      }

      /* Pose Modes: Thinking & Telemetry Review (2-Frame Cycle: pondering / telemetry scanning) */
      .pet-actor-box[data-mode="thinking"] .frame-thinking-a {
        opacity: 1;
        animation: pet-thinking-step-a 2.4s step-end infinite;
      }
      .pet-actor-box[data-mode="thinking"] .frame-thinking-b {
        opacity: 0;
        animation: pet-thinking-step-b 2.4s step-end infinite;
      }
      @keyframes pet-thinking-step-a {
        0%, 50%, 100% { opacity: 1; }
        51%, 99% { opacity: 0; }
      }
      @keyframes pet-thinking-step-b {
        0%, 50%, 100% { opacity: 0; }
        51%, 99% { opacity: 1; }
      }
      .pet-actor-box[data-mode="thinking"] {
        animation: pet-thinking-ponder 2.4s ease-in-out infinite alternate;
      }
      @keyframes pet-thinking-ponder {
        0% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-2px) rotate(-1.2deg); }
        100% { transform: translateY(0) rotate(0deg); }
      }

      /* Cheering & Victory Celebration (2-Frame Cycle: arms up / fist pump down) */
      .pet-actor-box[data-mode="cheer"] .frame-cheer-a,
      .pet-actor-box[data-mode="success"] .frame-cheer-a {
        opacity: 1;
        animation: pet-cheer-step-a 0.42s step-end infinite;
      }
      .pet-actor-box[data-mode="cheer"] .frame-cheer-b,
      .pet-actor-box[data-mode="success"] .frame-cheer-b {
        opacity: 0;
        animation: pet-cheer-step-b 0.42s step-end infinite;
      }
      @keyframes pet-cheer-step-a {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pet-cheer-step-b {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
      .pet-actor-box[data-mode="cheer"],
      .pet-actor-box[data-mode="success"] {
        animation: pet-cheer-bounce 0.42s cubic-bezier(0.18, 0.89, 0.32, 1.28) infinite alternate;
      }
      @keyframes pet-cheer-bounce {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(-7px) scale(1.02); }
      }

      /* Waving Greeting Pose (2-Frame Hand Wave Flutter) */
      .pet-actor-box[data-mode="wave"] .frame-wave-a {
        opacity: 1;
        animation: pet-wave-step-a 0.28s step-end infinite;
      }
      .pet-actor-box[data-mode="wave"] .frame-wave-b {
        opacity: 0;
        animation: pet-wave-step-b 0.28s step-end infinite;
      }
      @keyframes pet-wave-step-a {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pet-wave-step-b {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
      .pet-actor-box[data-mode="wave"] {
        animation: pet-wave-bob 0.56s ease-in-out infinite alternate;
      }
      @keyframes pet-wave-bob {
        0% { transform: translateY(0); }
        100% { transform: translateY(-3px); }
      }

      /* Sitting & Perching Pose (2-Frame Relaxed Posture Shift) */
      .pet-actor-box[data-mode="sit"] .frame-sit-a {
        opacity: 1;
        animation: pet-sit-step-a 3.2s step-end infinite;
      }
      .pet-actor-box[data-mode="sit"] .frame-sit-b {
        opacity: 0;
        animation: pet-sit-step-b 3.2s step-end infinite;
      }
      @keyframes pet-sit-step-a {
        0%, 65%, 100% { opacity: 1; }
        66%, 99% { opacity: 0; }
      }
      @keyframes pet-sit-step-b {
        0%, 65%, 100% { opacity: 0; }
        66%, 99% { opacity: 1; }
      }
      .pet-actor-box[data-mode="sit"] {
        animation: pet-sit-breathe 3.2s ease-in-out infinite alternate;
      }
      @keyframes pet-sit-breathe {
        0% { transform: translateY(0); }
        50% { transform: translateY(-1.5px) scaleY(1.008); }
        100% { transform: translateY(0); }
      }

      /* Handheld Gaming Pose on Beanbag (2-Frame Cycle: playing console / smiling cozy win) */
      .pet-actor-box[data-mode="game"] .frame-game-a {
        opacity: 1;
        animation: pet-game-step-a 2.8s step-end infinite;
      }
      .pet-actor-box[data-mode="game"] .frame-game-b {
        opacity: 0;
        animation: pet-game-step-b 2.8s step-end infinite;
      }
      @keyframes pet-game-step-a {
        0%, 60%, 100% { opacity: 1; }
        61%, 99% { opacity: 0; }
      }
      @keyframes pet-game-step-b {
        0%, 60%, 100% { opacity: 0; }
        61%, 99% { opacity: 1; }
      }
      .pet-actor-box[data-mode="game"] {
        animation: pet-game-breathe 2.8s ease-in-out infinite alternate;
      }
      @keyframes pet-game-breathe {
        0% { transform: translateY(0); }
        50% { transform: translateY(-1.5px) scaleY(1.008); }
        100% { transform: translateY(0); }
      }


      /* Peaceful Sleep & Nap Pose (2-Frame Breathing Cycle + Floating Cyber Zzz) */
      .pet-actor-box[data-mode="sleep"] .frame-sleep-a {
        opacity: 1;
        animation: pet-sleep-step-a 2.8s step-end infinite;
      }
      .pet-actor-box[data-mode="sleep"] .frame-sleep-b {
        opacity: 0;
        animation: pet-sleep-step-b 2.8s step-end infinite;
      }
      @keyframes pet-sleep-step-a {
        0%, 50%, 100% { opacity: 1; }
        51%, 99% { opacity: 0; }
      }
      @keyframes pet-sleep-step-b {
        0%, 50%, 100% { opacity: 0; }
        51%, 99% { opacity: 1; }
      }
      .pet-actor-box[data-mode="sleep"] {
        animation: pet-sleep-pulse 2.8s ease-in-out infinite alternate;
      }
      @keyframes pet-sleep-pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.012) translateY(-1.5px); }
        100% { transform: scale(1); }
      }

      /* Console Working & Typing (2-Frame Step) */
      .pet-actor-box[data-mode="work"] .frame-work-a {
        opacity: 1;
        animation: pet-work-step-a 0.38s step-end infinite;
      }
      .pet-actor-box[data-mode="work"] .frame-work-b {
        opacity: 0;
        animation: pet-work-step-b 0.38s step-end infinite;
      }
      @keyframes pet-work-step-a {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pet-work-step-b {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }

      /* Talking Animation (Silent visual bounce + aura) */
      .pet-actor-box[data-speaking="true"] {
        animation: pet-talking-bounce 0.22s ease-in-out infinite alternate;
      }
      .pet-actor-box[data-speaking="true"] .pet-frame {
        filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.55)) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.65));
      }

      @keyframes pet-talking-bounce {
        from { transform: translateY(0); }
        to { transform: translateY(-3px); }
      }

      /* Click Hop */
      .pet-actor-box.hop {
        animation: pet-hop 0.36s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      }

      @keyframes pet-hop {
        0% { transform: translateY(0) scale(1); }
        45% { transform: translateY(-12px) scale(1.04); }
        75% { transform: translateY(2px) scale(0.98); }
        100% { transform: translateY(0) scale(1); }
      }

      /* Dragging & Dangle Sway with Dedicated Airborne Dangle Sprite */
      .pet-actor-box[data-dragging="true"] {
        transform-origin: 50% 12% !important;
        cursor: grabbing !important;
        transition: none !important;
        animation: pet-dangle-sway 0.72s ease-in-out infinite alternate !important;
      }

      @keyframes pet-dangle-sway {
        0% {
          transform: translateY(-8px) rotate(calc(var(--drag-tilt, 0deg) - 6.5deg)) scale(0.95, 1.05);
        }
        100% {
          transform: translateY(-4px) rotate(calc(var(--drag-tilt, 0deg) + 6.5deg)) scale(0.97, 1.03);
        }
      }

      /* Alternating Mid-Air Leg Kicks */
      .pet-actor-box[data-dragging="true"] .frame-dangle-a {
        opacity: 1 !important;
        animation: pet-dangle-kick-a 0.36s step-end infinite !important;
      }
      .pet-actor-box[data-dragging="true"] .frame-dangle-b {
        opacity: 0 !important;
        animation: pet-dangle-kick-b 0.36s step-end infinite !important;
      }
      @keyframes pet-dangle-kick-a {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pet-dangle-kick-b {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }

      .pet-actor-box[data-dragging="true"] .frame-idle-a,
      .pet-actor-box[data-dragging="true"] .frame-idle-b,
      .pet-actor-box[data-dragging="true"] .frame-walk-l-a,

    <script>
      (function() {
        const actor = document.getElementById("pet-actor");
        const bubble = document.getElementById("pet-bubble");
        const bubbleText = document.getElementById("bubble-text");
        const menu = document.getElementById("pet-menu");
        const voiceLabel = document.getElementById("menu-voice-state");

        // Voice Sound is OFF by default as requested: visual talking only
        let voiceEnabled = false;
        let bubbleTimeout = null;
        let bubbleTimer = null;
        let speakingTimeout = null;

        const greetings = [
          "Standing by on desktop! Apps on the left, Nebs in center, files on the right.",
          "What's good, Bee? Ship's humming and console ready.",
          "Hull solid, telemetry green. Cruising the starfield with Nebs.",
          "I'm locked in right here on desktop. What we building?",
          "Radar clear, coffee warm. Ready when you are, cuz.",
          "Sovereign systems purring like a kitten. Let's get shit done."
        ];

        // Clean speech text
        function cleanSpeechText(text) {
          if (!text) return "";
          return text
            .replace(/```[\s\S]*?```/g, "Code block omitted.")
            .replace(/`([^`]+)`/g, "$1")
            .replace(/https?:\/\/\S+/g, "link")
            .replace(/\[([^\]]+)\]\([^\)]+\)/g, "$1")
            .replace(/[*_~#>-]/g, "")
            .replace(/[\u{1F300}-\u{1FAFF}]|[\u{2600}-\u{27BF}]/gu, "")
            .trim();
        }

        // Natural Voice Candidates
        const preferredVoicePatterns = ["Flo", "Shelley", "Sandy", "Moira", "Eddy", "Reed", "Daniel", "Tessa", "Ava"];
        let selectedVoiceIndex = 0;
        let voiceOptions = [];

        function initVoiceOptions() {
          if (!("speechSynthesis" in window)) return;
          const allVoices = window.speechSynthesis.getVoices() || [];
          if (!allVoices.length) return;

          const ranked = [];
          for (const pattern of preferredVoicePatterns) {
            const found = allVoices.find(v => v.name.includes(pattern));
            if (found && !ranked.includes(found)) ranked.push(found);
          }
          allVoices.forEach(v => {
            if (v.lang.startsWith("en") && !/samantha|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|wobble|whisper|zarvox/i.test(v.name)) {
              if (!ranked.includes(v)) ranked.push(v);
            }
          });

          voiceOptions = ranked.length ? ranked : allVoices;

          const saved = localStorage.getItem("beeps_voice_name");
          if (saved) {
            const idx = voiceOptions.findIndex(v => v.name === saved);
            if (idx !== -1) selectedVoiceIndex = idx;
          }

          updateVoiceLabel();
        }

        function updateVoiceLabel() {
          const current = voiceOptions[selectedVoiceIndex];
          const voiceNameEl = document.getElementById("menu-current-voice");
          if (current && voiceNameEl) {
            const shortName = current.name.replace(/\s*\(.*\)/, "").trim();
            voiceNameEl.textContent = shortName;
          }
        }

        function cycleVoice() {
          if (!voiceOptions.length) return;
          selectedVoiceIndex = (selectedVoiceIndex + 1) % voiceOptions.length;
          const newVoice = voiceOptions[selectedVoiceIndex];

        async function fetchDailyBriefCalendar() {
          try {
            const res = await fetch("http://127.0.0.1:4173/api/daily-brief");
            if (res.ok) {
              const data = await res.json();
              if (data && data.events) {
                cachedCalendarEvents = data.events;
                evaluateScheduleRoutine();
              }
            }
          } catch (_) {}
        }

        function evaluateScheduleRoutine() {
          const now = new Date();
          let matchedRoutine = null;

          // 1. Inspect live Google Calendar events
          for (const ev of cachedCalendarEvents) {
            if (!ev.start || !ev.end) continue;
            const start = new Date(ev.start);
            const end = new Date(ev.end);
            if (now >= start && now < end) {
              const text = ((ev.title || "") + " " + (ev.description || "")).toLowerCase();
              if (/\b(bego|session|work|client|meeting|treatment|consult)\b/.test(text)) {
                matchedRoutine = "operations_work";
                break;
              }
              if (/\b(shut the fuck down|bed|sleep|rawdog|night|unwind)\b/.test(text)) {
                matchedRoutine = "observatory_bed";
                break;
              }
              if (/\b(take the bra off|exist briefly|eat before you get mean|clothes out|future you|depression kitchen|home|dinner|decompress)\b/.test(text)) {
                matchedRoutine = "beanbag_home";
                break;
              }
              if (/\b(soft launch|enrichment|nebs|shower|human suit|bag goblin|morning|coffee|breakfast)\b/.test(text)) {
                matchedRoutine = "morning_coffee";
                break;
              }
            }
          }

          // 2. Fallback to Time-of-Day Rhythm
          if (!matchedRoutine) {
            const hour = now.getHours() + now.getMinutes() / 60.0;
            if (hour >= 6.0 && hour < 10.0) {
              matchedRoutine = "morning_coffee";
            } else if (hour >= 10.0 && hour < 17.0) {
              matchedRoutine = "operations_work";
            } else if (hour >= 17.0 && hour < 21.5) {
              matchedRoutine = "beanbag_home";
            } else {
              matchedRoutine = "observatory_bed";
            }
          }

          const routineChanged = (activeRoutineState !== matchedRoutine);
          activeRoutineState = matchedRoutine;

          if (currentIdleStationKey === "calendar_auto") {
            applyCalendarAutoRoutine(routineChanged);
          }
        }

        function applyCalendarAutoRoutine(announce = false) {
          const actorBox = document.getElementById("pet-actor");
          if (!actorBox) return;
          const isBeeps = !actorBox.dataset.character || actorBox.dataset.character === "beeps";
          if (!isBeeps) return;

          actorBox.dataset.routine = activeRoutineState;

          const nameEl = document.getElementById("menu-station-name");
          const frameIdleA = document.querySelector(".frame-idle-a");
          const frameIdleB = document.querySelector(".frame-idle-b");

          if (activeRoutineState === "morning_coffee") {
            if (nameEl) nameEl.textContent = "Auto: Coffee";
            if (frameIdleA) frameIdleA.src = "/assets/beeps-pose-command-deck-coffee-a-v3.png";
            if (frameIdleB) frameIdleB.src = "/assets/beeps-pose-command-deck-coffee-b-v3.png";
            if (announce) say("Morning coffee routine active! ☕", 2500);
          } else if (activeRoutineState === "operations_work") {
            if (nameEl) nameEl.textContent = "Auto: Operations";
            if (frameIdleA) frameIdleA.src = "/assets/beeps-idle-operations-engine-a-v2.png";
            if (frameIdleB) frameIdleB.src = "/assets/beeps-idle-operations-engine-b-v2.png";
            if (announce) say("Work session detected: Operations Engine online.", 2500);
          } else if (activeRoutineState === "beanbag_home") {
            if (nameEl) nameEl.textContent = "Auto: Beanbag";
            if (frameIdleA) frameIdleA.src = "/assets/beeps-pose-beanbag-idle-a-v2.png";
            if (frameIdleB) frameIdleB.src = "/assets/beeps-pose-beanbag-play-v2.png";
            if (announce) say("Welcome home! Kicked back on the beanbag deck. 👾", 2500);
          } else if (activeRoutineState === "observatory_bed") {
            if (nameEl) nameEl.textContent = "Auto: Observatory";
            if (frameIdleA) frameIdleA.src = "/assets/beeps-pose-observatory-study-a-v3.png";
            if (frameIdleB) frameIdleB.src = "/assets/beeps-pose-observatory-study-b-v3.png";

        function setPetIdleStation(stationKey, announce = false) {
          if (!BEEPS_IDLE_STATIONS[stationKey]) return;
          currentIdleStationKey = stationKey;
          localStorage.setItem("beeps_active_idle_option", stationKey);

          const actorBox = document.getElementById("pet-actor");
          const isBeeps = !actorBox || !actorBox.dataset.character || actorBox.dataset.character === "beeps";

          const selectEl = document.getElementById("beeps-station-select");
          if (selectEl) selectEl.value = stationKey;

          if (stationKey === "calendar_auto") {
            applyCalendarAutoRoutine(announce);
          } else {
            if (actorBox) actorBox.removeAttribute("data-routine");
            const station = BEEPS_IDLE_STATIONS[stationKey];
            if (isBeeps && station) {
              const frameIdleA = document.querySelector(".frame-idle-a");
              const frameIdleB = document.querySelector(".frame-idle-b");
              if (frameIdleA && station.spriteA) frameIdleA.src = station.spriteA;
              if (frameIdleB && station.spriteB) frameIdleB.src = station.spriteB;
            }
            const nameEl = document.getElementById("menu-station-name");
            if (nameEl && station) nameEl.textContent = station.short;
            if (announce && station && station.voiceLine) {
              say(station.voiceLine, 2800);
            }
          }

          sendHostIPC("setIdleStation", { station: stationKey });
        }
        window.setPetIdleStation = setPetIdleStation;

        // Crew Member Switcher & Automation Mapping
        function switchCrewMember(crewKey, customText) {
          const actorBox = document.getElementById("pet-actor");
          if (!actorBox) return;
          actorBox.dataset.character = crewKey;

          const stageBox = document.getElementById("pet-stage");
          if (stageBox) stageBox.dataset.character = crewKey;

          const crewMap = {
            beeps: "beeps",
            rivet: "rivet",
            alloy: "alloy",
            nebula: "nebula",
            nebs: "nebula",
            oreo: "oreo",
            doublestuff: "oreo",
            doublestuffiana: "oreo"
          };
          const resolvedCrew = crewMap[crewKey] || "beeps";

          const frames = actorBox.querySelectorAll(".pet-frame");
          const stationControls = [
            document.getElementById("station-menu-divider"),
            document.getElementById("station-menu-header"),
            document.getElementById("station-menu-control")
          ];

          if (resolvedCrew === "beeps") {
            // Restore planned human Beeps idle & stance frames
            if (currentIdleStationKey === "calendar_auto") {
              applyCalendarAutoRoutine(false);
            } else {
              const station = BEEPS_IDLE_STATIONS[currentIdleStationKey] || BEEPS_IDLE_STATIONS["command_deck"];
              const frameIdleA = document.querySelector(".frame-idle-a");
              const frameIdleB = document.querySelector(".frame-idle-b");
              if (frameIdleA && station && station.spriteA) frameIdleA.src = station.spriteA;
              if (frameIdleB && station && station.spriteB) frameIdleB.src = station.spriteB;
            }

            frames.forEach(frame => {
              for (const [cls, src] of Object.entries(BEEPS_HUMAN_DEFAULT_FRAMES)) {
                if (frame.classList.contains(cls)) {
                  frame.src = src;
                }
              }
            });

            stationControls.forEach(el => {
              if (el) el.style.display = "";
            });
          } else {
            // Robot crew members
            frames.forEach(frame => {
              const baseNameMatch = frame.className.match(/frame-([a-z0-9\-]+)/);
              if (baseNameMatch) {
                const baseName = baseNameMatch[1];
                let mode = "idle";
                let step = "a";
                if (baseName.includes("work")) mode = "work";
                else if (baseName.includes("cheer") || baseName.includes("complete") || baseName.includes("coffee") || baseName.includes("wave")) mode = "complete";
                else if (baseName.includes("error")) mode = "error";
                else mode = "idle";

                if (baseName.endsWith("-b") || baseName.endsWith("-d")) step = "b";
                else step = "a";

                frame.src = `/assets/robot-${resolvedCrew}-${mode}-${step}.png`;
              }
            });

            stationControls.forEach(el => {
              if (el) el.style.display = "none";
            });
          }

          // Trigger signature entrance animation
          actorBox.style.animation = "none";
          void actorBox.offsetWidth; // trigger reflow
          if (crewKey === "doublestuffiana") {
            actorBox.style.animation = "pet-thud-drop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
          } else if (crewKey === "alloy") {
            actorBox.style.animation = "pet-gremlin-pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
          } else if (crewKey === "nebula") {
            actorBox.style.animation = "pet-regal-slide 0.4s ease-out";
          }

          const speakerEl = document.getElementById("bubble-speaker");

          const buttons = document.querySelectorAll("#crew-switcher-strip .pet-zone-btn");
          buttons.forEach((b) => {
            if (b.dataset.crew === crewKey) b.classList.add("active");
            else b.classList.remove("active");
          });

          if (crewKey === "nebula") {
            if (speakerEl) {
              speakerEl.textContent = "OFFICER NEBULA";
              speakerEl.style.color = "#c084fc";
            }
            const barkChance = Math.random() < 0.4;
            if (barkChance) {
              say(customText || "BARK! BARK! *Sensor glitched at bulkhead* ...Pardon me. Systems nominal.", 4000);
            } else {
              say(customText || "Officer Nebula reporting to bridge. Standards are now in effect.", 3200);
            }
          } else if (crewKey === "alloy") {
            if (speakerEl) {
              speakerEl.textContent = "ALLOY";
              speakerEl.style.color = "#f59e0b";
            }
            say(customText || "Alloy here! Got my goggles down, sniffing for loose sockets!", 3000);
          } else if (crewKey === "doublestuffiana") {
            if (speakerEl) {
              speakerEl.textContent = "DOUBLESTUFFIANA";
              speakerEl.style.color = "#22c55e";
            }
            say(customText || "*THUD* Doublestuffiana has rolled onto the bridge! Break time soon!", 3500);
          } else {
            if (speakerEl) {
              speakerEl.textContent = "BEEPS";
              speakerEl.style.color = "var(--cyan)";
            }
            say(customText || "Beeps back on flight deck. What we building, Bee?", 2500);
          }
        }
        window.switchCrewMember = switchCrewMember;

        const crewButtons = document.querySelectorAll("#crew-switcher-strip .pet-zone-btn");
        crewButtons.forEach((btn) => {

        const stationSelect = document.getElementById("beeps-station-select");

        document.getElementById("menu-switch-voice").addEventListener("click", () => {

        document.getElementById("menu-wander").addEventListener("click", () => {

        document.getElementById("menu-pose-work").addEventListener("click", () => {

        document.getElementById("menu-pose-game").addEventListener("click", () => {

        document.getElementById("menu-pose-sleep").addEventListener("click", () => {

            window.webkit.messageHandlers.beepsHost.postMessage({ action: "stopWander" });
          }
          window.setPetMode("sleep", "Entering low-power sleep mode... Zzz.");

        document.getElementById("menu-pose-cheer").addEventListener("click", () => {
          menu.classList.remove("visible");
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.beepsHost) {
            window.webkit.messageHandlers.beepsHost.postMessage({ action: "stopWander" });
          }
          window.setPetMode("cheer", "Mission accomplished! Hull solid!");
        });

        document.getElementById("menu-pose-thinking").addEventListener("click", () => {
          menu.classList.remove("visible");
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.beepsHost) {
            window.webkit.messageHandlers.beepsHost.postMessage({ action: "stopWander" });
          }
          window.setPetMode("thinking", "Reviewing flight logs...");
        });

        async function safeFetch(url, options) {
          try {
            return await fetch(url, options);
          } catch (err) {
            return null;
          }
        }

        let isQueryingCompanion = false;
        let companionSessionId = null;
        async function queryCompanion(message = "Yo Beeps, quick check-in. What's on deck?") {
          if (isQueryingCompanion) return;
          isQueryingCompanion = true;
          window.setPetMode("thinking", "Checking comms with companion...");
          try {
            const controller = new AbortController();
            // Allow agents extended working time without premature timeouts (24h safety limit)
            let timeoutId = setTimeout(() => controller.abort(), 86400000);
            const res = await safeFetch("http://127.0.0.1:5000/chat/stream", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message, session_id: companionSessionId }),
              signal: controller.signal
            });
            if (!res || !res.ok) {
              clearTimeout(timeoutId);
              throw new Error(res ? "Status " + res.status : "Network failure on port 5000");
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let accumulatedText = "";
            let streamBuffer = "";

            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              clearTimeout(timeoutId);
              timeoutId = setTimeout(() => controller.abort(), 86400000);
              streamBuffer += decoder.decode(value, { stream: true });
              const lines = streamBuffer.split("\n");
              streamBuffer = lines.pop();

              for (const line of lines) {
                if (line.startsWith("data: ")) {
                  try {
                    const evt = JSON.parse(line.slice(6));
                    if (evt.type === "thought") {
                      window.setPetMode("thinking", "Pondering the flight logs...");
                    } else if (evt.type === "tool_call") {
                      const toolLabel = evt.name === "get_mission_control_status"
                        ? "Checking daemons..."
                        : evt.name === "get_recent_handoffs" || evt.name === "search_ship_memory"
                        ? "Searching ship memory..."
                        : `Running ${evt.name}...`;
                      window.setPetMode("work", toolLabel);
                    } else if (evt.type === "text") {
                      accumulatedText += evt.text;
                      window.setPetMode("wave");
                      say(accumulatedText, 8000);
                    } else if (evt.type === "done") {
                      clearTimeout(timeoutId);
                      if (evt.session_id) companionSessionId = evt.session_id;
                      if (evt.response) {
                        say(evt.response, 8000);
                      }
                      setTimeout(() => {
                        window.setPetMode("idle");
                      }, 4000);
                    }
                  } catch (parseErr) {}
                }
              }
            }
            clearTimeout(timeoutId);
          } catch (err) {
            // Port 5000 fallback to Navigator port 4173 /api/ask
            try {
              const res4173 = await safeFetch("http://127.0.0.1:4173/api/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: message, mode: "model" })
              });
              if (!res4173 || !res4173.ok) throw new Error(res4173 ? "Port 4173 status " + res4173.status : "Port 4173 offline");
              const data4173 = await res4173.json();
              const reply4173 = (data4173 && (data4173.answer || data4173.response || data4173.text))
                ? (data4173.answer || data4173.response || data4173.text).trim()
                : "Mission logs online. Standing by for instructions.";
              window.setPetMode("idle");
              say(reply4173, 5000);
            } catch (fallbackErr) {
              window.setPetMode("idle");
              say("Couldn't reach companion daemon on port 5000 or 4173.", 4000);
            }
          } finally {
            isQueryingCompanion = false;
          }
        }
        window.queryCompanion = queryCompanion;

        const pingBtn = document.getElementById("menu-ping-companion");
        if (pingBtn) {
          pingBtn.addEventListener("click", () => {
            menu.classList.remove("visible");
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.beepsHost) {
              window.webkit.messageHandlers.beepsHost.postMessage({ action: "stopWander" });
            }
            queryCompanion("Yo Beeps, quick check-in. How you doing and what's on deck?");
          });
        }
        const telBtn = document.getElementById("menu-view-telemetry");
        if (telBtn) {
          telBtn.addEventListener("click", async () => {
            menu.classList.remove("visible");
            try {
              const res = await fetch("http://127.0.0.1:4173/api/local/telemetry?limit=3");
              if (!res.ok) throw new Error("Status " + res.status);
              const data = await res.json();
              const latest = data.latest;
              if (latest) {
                say(`Telemetry [${latest.action}]: ${latest.details || latest.target || "Active"}`, 4500);
              } else {
                say("Telemetry live. No recent errors.", 3000);
              }
            } catch (err) {
              say("Telemetry offline or port 4173 unreachable.", 3500);
            }
          });
        }

        document.getElementById("menu-toggle-voice").addEventListener("click", () => {
          voiceEnabled = !voiceEnabled;
          voiceLabel.textContent = voiceEnabled ? "ON" : "OFF";
          voiceLabel.style.color = voiceEnabled ? "var(--cyan)" : "#94a3b8";
          menu.classList.remove("visible");
          if (!voiceEnabled && window.speechSynthesis) {
            window.speechSynthesis.cancel();
          }
          say(voiceEnabled ? "Voice sound enabled." : "Voice sound muted. Visual talking active.", 2500);
        });

        let persistEnabled = true;
        const persistStateLabel = document.getElementById("menu-persist-state");
        window.setAlwaysOnTopState = function(state) {
          persistEnabled = !!state;
          if (persistStateLabel) {
            persistStateLabel.textContent = persistEnabled ? "ON" : "OFF";
            persistStateLabel.style.color = persistEnabled ? "var(--cyan)" : "#94a3b8";
          }
        };

        const persistBtn = document.getElementById("menu-toggle-persist");
        if (persistBtn) {
          persistBtn.addEventListener("click", () => {
            menu.classList.remove("visible");
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.beepsHost) {
              window.webkit.messageHandlers.beepsHost.postMessage({ action: "toggleAlwaysOnTop" });
            } else {
              persistEnabled = !persistEnabled;
              window.setAlwaysOnTopState(persistEnabled);
              say(persistEnabled ? "Always on top enabled." : "Always on top disabled.", 2200);
            }
          });
        }

        document.getElementById("menu-close-pet").addEventListener("click", () => {
          menu.classList.remove("visible");
          hidePet();
        });

        // Pose State Machine: thinking -> work -> cheer -> idle
        let cheerTimer = null;

        function handleBeepsActionEvent(type, data = {}) {
          if (!type) return;

          // Route to specific crew member indicator if signaled by automation
          if (data.character || data.crew) {
            window.switchCrewMember(data.character || data.crew, data.text || data.summary);
          } else if (data.category === "qa" || data.category === "lint") {
            window.switchCrewMember("nebula", data.text || data.summary);
          } else if (data.category === "salvage" || data.category === "cache") {
            window.switchCrewMember("alloy", data.text || data.summary);
          } else if (data.category === "break" || data.category === "downtime") {
            window.switchCrewMember("doublestuffiana", data.text || data.summary);
          }

          if (type === "queued" || type === "routed" || type === "generating" || type === "thinking") {
            if (cheerTimer) {
              clearTimeout(cheerTimer);
              cheerTimer = null;
            }
            window.setPetMode("thinking");
          } else if (type === "tool" || type === "work") {
            if (cheerTimer) {
              clearTimeout(cheerTimer);
              cheerTimer = null;
            }
            window.setPetMode("work");
          } else if (type === "done" || type === "cheer") {
            if (cheerTimer) {
              clearTimeout(cheerTimer);
              cheerTimer = null;
            }
            let summary = data.summary || data.text || data.label || "Response complete.";
            summary = summary.replace(/[#*`_~]/g, "").trim();
            if (summary.length > 100) summary = summary.slice(0, 97) + "...";
            window.setPetMode("cheer", summary);

            cheerTimer = setTimeout(() => {
              if (actor.dataset.mode === "cheer") {
                window.setPetMode("idle");
              }
              cheerTimer = null;
            }, 4500);
          } else if (type === "idle") {
            if (cheerTimer) {
              clearTimeout(cheerTimer);
              cheerTimer = null;
            }
            window.setPetMode("idle", data.text || data.label);
          } else if (type === "wave") {
            window.setPetMode("wave", data.text || data.label);
          }
        }
        window.handleBeepsActionEvent = handleBeepsActionEvent;

        // Action stream subscription over SSE with exponential backoff
        let sseConnection = null;
        let sseRetryDelay = 1000;
        const SSE_MAX_DELAY = 30000;

        function connectActionStream() {
          if (typeof EventSource === "undefined") return;
          if (sseConnection) {
            try { sseConnection.close(); } catch (_) {}
            sseConnection = null;
          }

          const sseOrigin = (window.location && window.location.origin && window.location.origin.startsWith("http"))
            ? ""
            : "http://127.0.0.1:4173";
          const streamUrl = `${sseOrigin}/api/local/conversations/stream`;

          try {
            sseConnection = new EventSource(streamUrl);

            sseConnection.onopen = () => {
              sseRetryDelay = 1000;
            };

            const parsePayload = (e) => {
              try {
                return JSON.parse(e.data);
              } catch (_) {
                return { label: e.data };
              }
            };

            sseConnection.addEventListener("queued", (e) => {
              handleBeepsActionEvent("queued", parsePayload(e));
            });
            sseConnection.addEventListener("routed", (e) => {
              handleBeepsActionEvent("routed", parsePayload(e));
            });
            sseConnection.addEventListener("generating", (e) => {
              handleBeepsActionEvent("generating", parsePayload(e));
            });
            sseConnection.addEventListener("tool", (e) => {
              handleBeepsActionEvent("tool", parsePayload(e));
            });
            sseConnection.addEventListener("done", (e) => {
              handleBeepsActionEvent("done", parsePayload(e));
            });

            sseConnection.onmessage = (e) => {
              const data = parsePayload(e);
              if (data && data.type) {
                handleBeepsActionEvent(data.type, data);
              }
            };

            sseConnection.onerror = () => {
              if (sseConnection) {
                try { sseConnection.close(); } catch (_) {}
                sseConnection = null;
              }
              const delay = sseRetryDelay;
              sseRetryDelay = Math.min(sseRetryDelay * 2, SSE_MAX_DELAY);
              setTimeout(connectActionStream, delay);
            };
          } catch (err) {
            const delay = sseRetryDelay;
            sseRetryDelay = Math.min(sseRetryDelay * 2, SSE_MAX_DELAY);
            setTimeout(connectActionStream, delay);
          }
        }

        connectActionStream();

        // BroadcastChannel to sync speech with Beeps Local
        if ("BroadcastChannel" in window) {
          const channel = new BroadcastChannel("beeps_sync");
          channel.onmessage = (event) => {
            if (!event.data) return;
            if (event.data.type === "beeps_speech") {
              say(event.data.text);
            } else if (event.data.type === "beeps_action") {
              handleBeepsActionEvent(event.data.action, event.data);
            }
          };
        }

        // Initialize saved Beeps idle station & schedule evaluation
        setPetIdleStation(currentIdleStationKey, false);
        fetchDailyBriefCalendar();
        setInterval(fetchDailyBriefCalendar, 45000);
        setInterval(evaluateScheduleRoutine, 15000);

        // Initial welcome speech on launch (silent bubble by default)
        setTimeout(() => {
          say("Standing by on desktop!", 3000);
        }, 500);
      })();
